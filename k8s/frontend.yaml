apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: imputer-advisor
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # NOTE: build this image with --build-arg VITE_API_URL="" so the
          # browser uses same-origin /api (proxied by nginx to `backend:8000`)
          image: imputer-advisor-frontend:latest # set to your registry image
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: imputer-advisor
spec:
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: 80 }
